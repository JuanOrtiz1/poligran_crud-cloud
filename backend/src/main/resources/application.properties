spring.application.name=registros
spring.config.import=optional:file:./config/local.properties
server.address=127.0.0.1
server.port=8080
spring.servlet.multipart.max-file-size=${CSV_MAX_FILE_SIZE:2MB}
spring.servlet.multipart.max-request-size=${CSV_MAX_REQUEST_SIZE:3MB}
app.csv.max-rows=${CSV_MAX_ROWS:1000}
app.firebase.project-id=${FIREBASE_PROJECT_ID:cloudsync-datalab}
app.firebase.database-id=${FIREBASE_DATABASE_ID:(default)}
app.firebase.collection=${FIREBASE_COLLECTION:registros}
app.firebase.credentials-file=${GOOGLE_APPLICATION_CREDENTIALS:}
server.error.include-message=never
server.error.include-stacktrace=never
